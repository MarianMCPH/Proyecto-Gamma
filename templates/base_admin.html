{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Administrativo - Frío y Agroindustria SpA{% endblock %}</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/style_web.css' %}">
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Menú lateral corregido (visible en desktop, colapsable en móvil) -->
            <nav id="menu" class="col-md-3 col-lg-2 d-md-block lateral px-0 collapse">
                <div class="lateral-int d-flex flex-column h-100 p-3">
                    <div class="logo-caja mb-3 text-center">
                        <img src="{% static 'img/logo.png' %}" alt="Frío y Agroindustria SpA" class="img-fluid">
                    </div>
                    <ul class="nav flex-column mt-3">
                        <li class="nav-item mb-1">
                            <a class="nav-link" href="#"><i class="bi bi-bar-chart-steps me-2"></i>Dashboard</a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link" href="#"><i class="bi bi-tools me-2"></i>Gestión de Obras</a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link" href="#"><i class="bi bi-people me-2"></i>Personal y Usuarios</a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link activo" href="#" aria-current="page"><i class="bi bi-clipboard-check me-2"></i>Auditoría de Obras</a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link" href="#"><i class="bi bi-box-seam me-2"></i>Solicitudes de Insumos</a>
                        </li>
                    </ul>
                    <div class="perfil mt-auto pt-3">
                        <i class="bi bi-person-circle fs-1"></i>
                        <span class="d-block fw-medium small mb-2">Administrador Central</span>
                        <a href="#" class="btn btn-sm btn-outline-light w-100 rounded-pill">Cerrar sesión</a>
                    </div>
                </div>
            </nav>

            <!-- Contenido Principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <!-- Botón superior móvil para alternar el menú -->
                <div class="d-md-none mb-3">
                    <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-expanded="false" aria-controls="menu">
                        <i class="bi bi-list"></i> Menú Principal
                    </button>
                </div>

                {% block content %}
                <!-- Aquí se inyectará el contenido dinámico de cada vista en Django -->
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
