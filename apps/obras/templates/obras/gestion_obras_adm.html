{% extends "base_admin.html" %}
{% load static %}

{% block page_title %}Gestión de Obras y Servicios{% endblock %}

{% block content %}

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/gestion_obras.css' %}">

    <!-- Bloque de Filtros y Acciones -->
    <div class="card-custom p-3 mb-4">
        
        <!-- Fila 1: Pestañas de Estado y Enlace de Nueva Orden de Trabajo al mismo nivel -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div class="d-flex align-items-center flex-wrap gap-2">
                <button class="btn btn-sm text-white px-3" style="background-color: #3f4268;">Todas <span class="badge bg-light text-dark ms-1">0</span></button>
                <button class="btn btn-sm btn-outline-secondary px-3">En proceso <span class="badge bg-light text-dark ms-1">0</span></button>
                <button class="btn btn-sm btn-outline-secondary px-3">Pendientes <span class="badge bg-light text-dark ms-1">0</span></button>
                <button class="btn btn-sm btn-outline-danger px-3">Emergencias <span class="badge bg-danger ms-1">0</span></button>
                <button class="btn btn-sm btn-outline-secondary px-3">Finalizadas <span class="badge bg-light text-dark ms-1">0</span></button>
            </div>
            
            <!-- Redirige a la página de nueva orden -->
            <a href="{% url 'obras:nueva_obra' %}" class="btn btn-sm text-white fw-semibold shadow-sm px-3 py-1.5 text-nowrap text-decoration-none" style="background-color: #3f4270;">
                <i class="bi bi-plus-lg me-1"></i> Nueva orden de trabajo
            </a>
        </div>

        <!-- Fila 2: Búsqueda rápida (Botón "Filtrar por..." eliminado) -->
        <div class="d-flex align-items-center gap-2">
            <div class="input-group input-group-sm" style="max-width: 280px;">
                <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control" placeholder="Búsqueda rápida">
            </div>
        </div>

    </div>

    <!-- Tabla de Obras / Servicios Modificada -->
    <div class="card-custom p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
                <thead class="table-light text-muted">
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" class="form-check-input"></th>
                        <th>Cliente</th>
                        <th>Tipo de servicio</th>
                        <th>Técnico</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Fila de estado vacío (colspan ajustado a 6) -->
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-folder2-open display-6 d-block mb-2 text-secondary opacity-50"></i>
                            No hay órdenes de trabajo ni obras registradas actualmente.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
