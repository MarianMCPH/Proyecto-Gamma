{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Terreno - FYAG Móvil</title>
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Estilos específicos para el login móvil -->
    <link rel="stylesheet" href="{% static 'css/style_pwa.css' %}">
</head>
<body class="pwa-login-body">

    <!-- Encabezado Móvil: Botón Volver, Logotipo y Título del Portal de Terreno -->
    <header class="pwa-login-header text-center pt-3 pb-2 px-3">
        <div class="d-flex justify-content-start mb-2">
     
            <a href="{% url 'core:inicio' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div class="d-flex justify-content-center mb-3">
            <div class="d-flex align-items-center p-1 shadow-sm logo-box">
                <a href="https://frioyagroindustria.cl/">
                    <img src="{% static 'img/logo.png' %}" alt="FYAG Frío y Agroindustria" style="height: 60px; width: auto;">
                </a>
            </div>
        </div>
        <h1 class="fw-bold text-institutional m-0">Portal de Terreno</h1>
    </header>

    <!-- Contenedor Principal: Tarjeta Central de Inicio de Sesión -->
    <main class="container d-flex justify-content-center align-items-center my-auto px-3 py-3">
        <div class="card login-card p-4 shadow-sm w-100">
            <h3 class="fw-normal text-dark mb-1 fs-5">Bienvenido/a</h3>
            <p class="text-muted small mb-3">Ingrese sus credenciales</p>

            <!-- Alertas de error de Django -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 small text-center" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <!-- Formulario conectado a la vista PWALoginView por POST -->
            <form id="pwaLoginForm" action="{% url 'core:login' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" id="pwaUser" name="username" class="form-control py-2 text-muted small" placeholder="Nombre de usuario o RUT" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="pwaPass" name="password" class="form-control py-2 text-muted small" placeholder="Contraseña" required>
                </div>
                <button type="submit" id="btnLoginSubmit" class="btn btn-institutional w-100 py-2 fw-medium shadow-sm">Iniciar sesión</button>
            </form>

            <!-- Nota de Seguridad Institucional -->
            <div class="text-center mt-3">
                <small class="text-muted" style="font-size: 10px;">Acceso protegido mediante autenticación segura • FYAG 2026</small>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica JS del Login Móvil -->
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
